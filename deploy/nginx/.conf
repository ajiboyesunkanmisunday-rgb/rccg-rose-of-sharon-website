# media.rccgros.org - 3005 media  ->  Next.js app on port .   Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled,
# then:  sudo certbot --nginx -d media.rccgros.org -d - -d 3005 -d media -d    &&   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name media.rccgros.org - 3005 media ;

    # compress text responses
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
