# Main site. In Netlify set: Base directory = apps/main, Build command = npm run build, Publish directory = .next
[build]
  command = "npm run build"
  # Skip the build when neither this app nor the shared package / scripts changed.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/shared ../../scripts ../../package.json"

[build.environment]
  NODE_VERSION = "22"
  # Where the four sites live while they are hosted on Netlify. When everything moves to the server,
  # change these (or override them in the host's environment) to the rccgros.org addresses.
  NEXT_PUBLIC_URL_MAIN = "https://rccg-ros.netlify.app"
  NEXT_PUBLIC_URL_YOUTH = "https://rccg-ros-youth.netlify.app"
  NEXT_PUBLIC_URL_TRAINING = "https://rccg-ros-training.netlify.app"
  NEXT_PUBLIC_URL_MEDIA = "https://rccg-ros-media.netlify.app"

# Static files change rarely: let browsers keep them instead of re-checking on every visit.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/youth/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/marketplace/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
